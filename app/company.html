<!DOCTYPE html>
<html>
<head>
    <title>Company Portal - Download Document</title>
    <style>
        body { font-family: Arial; margin: 40px; background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #764ba2; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        button { padding: 14px 28px; margin: 10px 5px; font-size: 16px; 
                background: #764ba2; color: white; border: none; 
                border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a3678; transform: translateY(-2px); transition: all 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { background: #f8f9fa; padding: 20px; margin: 20px 0; 
                 border-radius: 8px; border-left: 4px solid #764ba2; }
        input[type="text"] { 
            padding: 12px; margin: 10px 0; width: 100%; font-size: 16px; 
            border: 2px solid #e2e8f0; border-radius: 6px; box-sizing: border-box;
            font-family: monospace;
        }
        .success { color: #38a169; font-weight: bold; }
        .error { color: #e53e3e; font-weight: bold; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #2d3748; }
        .document-box { background: #edf2f7; padding: 20px; border-radius: 6px; margin: 15px 0; }
        .download-btn { background: #48bb78; }
        .download-btn:hover { background: #38a169; }
        .receipt-btn { background: #667eea; }
        .receipt-btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 Company Portal</h1>
        <p class="subtitle">Download documents using the token from your email</p>
        
        <div class="result">
            <h2>Enter Download Token</h2>
            <p>Paste the token you received via email from the supplier</p>
            
            <label>Download Token: *</label>
            <input type="text" id="downloadToken" placeholder="Paste your token here..." required>
            
            <button onclick="retrieveDocument()">🔍 Retrieve Document</button>
            <div id="retrieveResult"></div>
        </div>
        
        <div class="result" id="documentSection" style="display:none;">
            <h2>📄 Document Details</h2>
            <div class="document-box" id="documentInfo"></div>
            
            <button class="download-btn" onclick="downloadDocument()">⬇️ Download Document</button>
            <button class="receipt-btn" onclick="confirmReceipt()">✅ Confirm Receipt</button>
            
            <div id="actionResult"></div>
        </div>
    </div>
    
    <script>
        const baseUrl = window.location.origin + '/odata/v4/shipment';
        let currentShipmentData = null;
        
        async function retrieveDocument() {
            const resultDiv = document.getElementById('retrieveResult');
            const token = document.getElementById('downloadToken').value.trim();
            
            if (!token) {
                resultDiv.innerHTML = '<p class="error">❌ Please enter a token</p>';
                return;
            }
            
            resultDiv.innerHTML = '<p>⏳ Retrieving document...</p>';
            
            try {
                const response = await fetch(baseUrl + '/retrieveDocument', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Failed to retrieve document');
                }
                
                const data = await response.json();
                currentShipmentData = data;
                
                // Display document info
                document.getElementById('documentInfo').innerHTML = `
                    <p><strong>Document Name:</strong> ${data.documentName}</p>
                    <p><strong>File Size:</strong> ${formatFileSize(data.documentSize)}</p>
                    <p><strong>Supplier ID:</strong> ${data.supplierID}</p>
                    <p><strong>Uploaded:</strong> ${new Date(data.createdAt).toLocaleString()}</p>
                    <p><strong>Status:</strong> ${data.status}</p>
                `;
                
                document.getElementById('documentSection').style.display = 'block';
                resultDiv.innerHTML = '<p class="success">✅ Document found!</p>';
                
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function downloadDocument() {
            const resultDiv = document.getElementById('actionResult');
            const token = document.getElementById('downloadToken').value.trim();
            
            resultDiv.innerHTML = '<p>⏳ Downloading document...</p>';
            
            try {
                const response = await fetch(baseUrl + '/downloadDocument', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                if (!response.ok) {
                    throw new Error('Download failed');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentShipmentData.documentName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                resultDiv.innerHTML = '<p class="success">✅ Document downloaded successfully!</p>';
                
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function confirmReceipt() {
            const resultDiv = document.getElementById('actionResult');
            const token = document.getElementById('downloadToken').value.trim();
            
            resultDiv.innerHTML = '<p>⏳ Confirming receipt...</p>';
            
            try {
                const response = await fetch(baseUrl + '/confirmReceipt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to confirm receipt');
                }
                
                resultDiv.innerHTML = '<p class="success">✅ Receipt confirmed! Supplier has been notified.</p>';
                
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
